# Nombre del workflow (aparece en GitHub Actions)
name: Validar Proyecto Contador

# CUÁNDO se ejecuta automáticamente
on:
  push:                # Cuando alguien hace push
    branches: [ main ] # Solo en rama main
  pull_request:        # También cuando abren PR
    branches: [ main ]

# QUÉ trabajos ejecutar
jobs:
  # Nombre del trabajo
  validar:
    # Máquina donde corre (GitHub proporciona)
    runs-on: ubuntu-latest
    
    # Pasos que ejecutar en orden
    steps:
      
      # PASO 1: Descargar el código del repo
      - name: 📥 Descargar código
        uses: actions/checkout@v4
      
      # PASO 2: Verificar que archivos existen
      - name: 📁 Verificar archivos necesarios
        run: |
          echo "🔍 Verificando archivos..."
          
          # Verificar index.html
          if [ -f "index.html" ]; then
            echo "✅ index.html existe"
          else
            echo "❌ Error: falta index.html"
            exit 1
          fi
          
          # Verificar style.css
          if [ -f "style.css" ]; then
            echo "✅ style.css existe"
          else
            echo "❌ Error: falta style.css"
            exit 1
          fi
          
          # Verificar script.js
          if [ -f "script.js" ]; then
            echo "✅ script.js existe"
          else
            echo "❌ Error: falta script.js"
            exit 1
          fi
          
          echo "🎉 Todos los archivos presentes!"
      
      # PASO 3: Mostrar estructura del proyecto
      - name: 📂 Mostrar archivos
        run: |
          echo "📂 Estructura del proyecto:"
          ls -la
      
      # PASO 4: Verificar que HTML tiene estructura básica
      - name: 🌐 Validar HTML
        run: |
          echo "🔍 Verificando HTML..."
          
          # Buscar <!DOCTYPE html>
          if grep -q "<!DOCTYPE html>" index.html; then
            echo "✅ DOCTYPE correcto"
          else
            echo "⚠️  Sin DOCTYPE"
          fi
          
          # Buscar etiquetas html
          if grep -q "<html" index.html && grep -q "</html>" index.html; then
            echo "✅ Etiquetas <html> presentes"
          else
            echo "⚠️  Faltan etiquetas html"
          fi
      
      # PASO 5: Verificar enlaces CSS y JS
      - name: 🔗 Verificar enlaces
        run: |
          echo "🔍 Verificando enlaces en HTML..."
          
          # Verificar link a CSS
          if grep -q "style.css" index.html; then
            echo "✅ CSS enlazado"
          else
            echo "⚠️  CSS no enlazado"
          fi
          
          # Verificar script JS
          if grep -q "script.js" index.html; then
            echo "✅ JavaScript enlazado"
          else
            echo "⚠️  JS no enlazado"
          fi
      
      # PASO 6: Verificar funciones en JavaScript
      - name: ⚡ Validar funciones JavaScript
        run: |
          echo "🔍 Verificando funciones..."
          
          if grep -q "function incrementar" script.js; then
            echo "✅ Función incrementar existe"
          else
            echo "⚠️  Falta función incrementar"
          fi
          
          if grep -q "function decrementar" script.js; then
            echo "✅ Función decrementar existe"
          else
            echo "⚠️  Falta función decrementar"
          fi
      
      # PASO 7: Mensaje final
      - name: ✅ Validación completada
        run: echo "🎉 ¡Proyecto Contador validado exitosamente!"
