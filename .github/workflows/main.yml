# Nombre del workflow
name: Validar proyecto contador

# Cuándo se ejecuta automáticamente
on:
  push:                # Cuando alguien hace push
    branches: [ main ]  # Solo en la rama main
  pull_request:        # Cuando alguien hace pull request
    branches: [ main ]

# Qué trabajos realizar
jobs:
  # Trabajo de verificación
  verificar:
    # Máquina virtual donde se ejecuta
    runs-on: ubuntu-latest
    
    # Pasos a ejecutar
    steps:
      # Paso 1: Clonar el repositorio
      - name: 📥 Descargar código
        uses: actions/checkout@v4
      
      # Paso 2: Verificar que los archivos existen
      - name: 📁 Verificar archivos necesarios
        run: |
          echo "🔍 Verificando archivos del proyecto..."
          
          # Verificar que index.html existe
          if [ -f "index.html" ]; then
            echo "✅ index.html existe"
          else
            echo "❌ Error: falta index.html"
            exit 1
          fi
          
          # Verificar que style.css existe
          if [ -f "style.css" ]; then
            echo "✅ style.css existe"
          else
            echo "❌ Error: falta style.css"
            exit 1
          fi
          
          # Verificar que script.js existe
          if [ -f "script.js" ]; then
            echo "✅ script.js existe"
          else
            echo "❌ Error: falta script.js"
            exit 1
          fi
          
          echo "🎉 Todos los archivos están presentes!"
      
      # Paso 3: Mostrar estructura del proyecto
      - name: 📂 Mostrar estructura de archivos
        run: |
          echo "📂 Estructura del proyecto:"
          ls -la
      
      # Paso 4: Verificar sintaxis HTML (opcional)
      - name: 🌐 Verificar HTML
        run: |
          echo "🔍 Verificando sintaxis HTML básica..."
          
          # Verificar que tiene <!DOCTYPE html>
          if grep -q "<!DOCTYPE html>" index.html; then
            echo "✅ HTML tiene DOCTYPE correcto"
          else
            echo "⚠️  Advertencia: falta DOCTYPE"
          fi
          
          # Verificar que tiene <html> y </html>
          if grep -q "<html" index.html && grep -q "</html>" index.html; then
            echo "✅ HTML tiene etiquetas html"
          else
            echo "⚠️  Advertencia: falta etiquetas html"
          fi
      
      # Paso 5: Verificar enlaces CSS y JS
      - name: 🔗 Verificar enlaces
        run: |
          echo "🔍 Verificando enlaces..."
          
          # Verificar que enlaza style.css
          if grep -q "style.css" index.html; then
            echo "✅ CSS enlazado correctamente"
          else
            echo "⚠️  Advertencia: style.css no enlazado"
          fi
          
          # Verificar que enlaza script.js
          if grep -q "script.js" index.html; then
            echo "✅ JavaScript enlazado correctamente"
          else
            echo "⚠️  Advertencia: script.js no enlazado"
          fi
      
      # Paso 6: Verificar funciones en JavaScript
      - name: ⚡ Verificar funciones JavaScript
        run: |
          echo "🔍 Verificando funciones..."
          
          # Verificar que existe función incrementar
          if grep -q "function incrementar" script.js; then
            echo "✅ Función incrementar existe"
          else
            echo "⚠️  Advertencia: falta función incrementar"
          fi
          
          # Verificar que existe función decrementar
          if grep -q "function decrementar" script.js; then
            echo "✅ Función decrementar existe"
          else
            echo "⚠️  Advertencia: falta función decrementar"
          fi
          
          # Verificar que existe función multiplicar
          if grep -q "function multiplicar" script.js; then
            echo "✅ Función multiplicar existe"
          else
            echo "⚠️  Advertencia: falta función multiplicar"
          fi

      # Paso 7: Verificación completada
      - name: ✅ Verificación completada
        run: |
          echo "🎉 ¡Verificación completada exitosamente!"
          echo "📝 El proyecto Contador Interactivo está listo para usar."
          echo "💻 Puedes abrir index.html en tu navegador para probarlo."
      
      # Paso 8: Mostrar valor del secret API_KEY
      - name: 🔑 Mostrar API_KEY
        run: |
          echo "🔑 El valor de API_KEY es: ${{ secrets.API_KEY }}"
